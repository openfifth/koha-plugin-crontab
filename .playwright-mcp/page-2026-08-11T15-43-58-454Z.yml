                  - 'option "sitemap.pl perl Description: Process all biblio records from a Koha instance and generate Sitemap files complying with this protocol as described on <http://sitemaps.org>. The goal of this script is to be able to provide to search engines direct access to biblio records. It avoid leaving search engine browsing Koha OPAC and so generating a lot of traffic, and workload, for a bad result. A file name sitemapindex.xml is generated. It contains references to Sitemap multiples files. Each file contains at most 50,000 urls, and is named sitemapXXXX.xml. The files must be stored on Koha OPAC root directory, ie <koha-root/koha-tmpl/>. Place also in this directory a robots.txt file like this one: Sitemap: sitemapindex.xml User-agent: * Disallow: /cgi-bin/ sitemap.pl" [ref=f2e494] [cursor=pointer]':
