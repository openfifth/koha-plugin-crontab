                      - text: "Description: This script is designed to alert patrons and administrators of overdue items. Configuration: This script pays attention to the overdue notice configuration performed in the \"Overdue notice/status triggers\" section of the \"Tools\" area of the staff interface to Koha. There, you can choose which letter templates are sent out after a configurable number of days to patrons of each library. More information about the use of this section of Koha is available in the Koha manual. The templates used to craft the emails are defined in the \"Tools: Notices\" section of the staff interface to Koha. Outgoing emails: Typically, messages are prepared for each patron with overdue items. Messages for whom there is no email address on file are collected and sent as attachments in a single email to each library administrator, or if that is not set, then to the email address in the \"KohaAdminEmailAddress\" system preference. These emails are staged in the outgoing message queue, as are messages produced by other features of Koha. This message queue must be processed regularly by the misc/cronjobs/process_message_queue.pl program. In the event that the \"-n\" flag is passed to this program, no emails are sent. Instead, messages are sent on standard output from this program. They may be redirected to a file if desired. Templates: Templates can contain variables enclosed in double angle brackets like <<this>>. Those variables will be replaced with values specific to the overdue items or relevant patron. Available variables are: <<bib>> the name of the library <<items.content>> one line for each item, each line containing a tab separated list of title, author, barcode, issuedate <<borrowers.*>> any field from the borrowers table <<branches.*>> any field from the branches table csv output: The \"-csv\" command line option lets you specify a file to which overdues data should be output in CSV format. With the \"-n\" flag set, data about all overdues is written to the file. Without that flag, only information about overdues that were unable to be sent directly to the patrons will be written. In other words, this CSV file replaces the data that is typically sent to the administrator email address."
